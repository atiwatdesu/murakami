<style>
/* Layout: one long dark page (hero, story, menu, visit). Floating cart bar, bottom sheet, status overlay, hidden admin overlay. */
:root{--ink:#0f0d0d;--coal:#181414;--line:#2b2424;--line2:#4a3d3d;--paper:#eee5da;--mute:#a0958c;--red:#c4232c;--red-hi:#e04650;--glow:rgba(196,35,44,.38);

/* Receipt drawing never uses ctx.textAlign (some phones ignore it): every text is placed with measureText. */
function drawReceipt(g,S,rows,tot,W){
 const L=t(),pad=48,IW=W-2*pad;
 const F=(w,z)=>`${w} ${z}px 'Noto Sans Thai','Noto Sans JP',system-ui,sans-serif`;
 g.textBaseline='alphabetic';
 const txt=(s,x,y,font,col,al)=>{g.font=font;g.fillStyle=col;const w=g.measureText(s).width;g.fillText(s,al==='r'?x-w:al==='c'?x-w/2:x,y);return w};
 const hr=(y,dash)=>{g.strokeStyle='#bbb';g.lineWidth=1.5;g.setLineDash(dash?[6,6]:[]);g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke();g.setLineDash([])};
 txt('Murakami Ramen',W/2,96,F(700,42),'#111','c');
 txt('村上ラーメン',W/2,132,F(400,22),'#777','c');
 hr(166);
 txt(`${L.tableLbl} ${S.table}`,pad,226,F(700,40),'#111');
 txt(`${L.tIn}: ${fmtDT(S.openedAt)}`,pad,276,F(400,24),'#333');
 txt(`${L.tOut}: ${fmtDT(S.closedAt||Date.now())}`,pad,314,F(400,24),'#333');
 hr(348,true);
 let y=404;
 rows.forEach(r=>{
  const amt=money(r.amt);g.font=F(600,28);const aw=g.measureText(amt).width;
  g.font=F(400,28);const lines=wrapText(g,itemName(r.id),IW-aw-28);
  lines.forEach((ln,i)=>txt(ln,pad,y+i*40,F(400,28),'#111'));
  txt(amt,W-pad,y,F(600,28),'#111','r');
  y+=(lines.length-1)*40+34;
  txt(`${r.qty} × ${money(r.price)}`,pad,y,F(400,22),'#777');
  y+=46;
 });
 if(!rows.length){txt(L.noMine,pad,y,F(400,26),'#777');y+=46}
 hr(y-14,true);y+=46;
 txt(L.total,pad,y,F(700,34),'#111');
 txt(`${money(tot)} ${L.baht}`,W-pad,y+2,F(700,42),'#111','r');
 y+=86;
 txt(L.thanks,W/2,y,F(700,32),'#111','c');
 y+=46;
 g.font=F(400,20);wrapText(g,L.notReceipt,IW).forEach(z=>{txt(z,W/2,y,F(400,20),'#777','c');y+=28});
 return y+36;
}
async function makeReceipt(S){

 const F=(w,z)=>`${w} ${z}px 'Noto Sans Thai','Noto Sans JP',system-ui,sans-serif`;
 try{await Promise.all([document.fonts.load(F(400,24),'กขค'),document.fonts.load(F(600,24),'กขค'),document.fonts.load(F(700,24),'กขค'),document.fonts.load(F(400,24),'あ漢')])}catch(e){}
 const probe=document.createElement('canvas');probe.width=W;probe.height=1200+rows.length*240;
 const H=Math.ceil(drawReceipt(probe.getContext('2d'),S,rows,tot,W));
 const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;
 const g=c.getContext('2d');g.scale(sc,sc);g.fillStyle='#fff';g.fillRect(0,0,W,H);
 drawReceipt(g,S,rows,tot,W);
 return c;
}

function makeWav(seq){
 const sr=22050;let n=0;seq.forEach(([f,d,g])=>n+=Math.round(sr*(d+(g||0))/1000));
 const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
 const w=(o,z)=>{for(let i=0;i<z.length;i++)v.setUint8(o+i,z.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 let p=44;
 seq.forEach(([f,d,g])=>{const nd=Math.round(sr*d/1000),ng=Math.round(sr*(g||0)/1000);
  for(let i=0;i<nd;i++){const x=i/sr,env=Math.min(1,i/(sr*.008))*Math.min(1,(nd-i)/(sr*.05));
   const y=(Math.sin(2*Math.PI*f*x)+.35*Math.sin(4*Math.PI*f*x))/1.35*env*.9;v.setInt16(p,Math.round(y*32767),true);p+=2}
  for(let i=0;i<ng;i++){v.setInt16(p,0,true);p+=2}});
 return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

 <ul class="a-it">${o.lines.filter(l=>!l.x).map(l=>`<li><b>${l.qty} ×</b> ${itemName(l.id,'th')}${l.note?`<small>${esc(l.note)}</small>`:''}</li>`).join('')}</ul>
 <div class="a-act"><button class="btn" data-a="next" data-sid="${o.sid}" data-id="${o.id}">${NEXT[o.status]} →</button>${o.status>0?`<button class="btn ghost" data-a="prev" data-sid="${o.sid}" data-id="${o.id}">ย้อนสถานะ</button>`:''}<button class="btn ghost" data-a="cancel" data-sid="${o.sid}" data-id="${o.id}">${cancelArm===o.sid+o.id?'กดอีกครั้งเพื่อยืนยันยกเลิก':'ยกเลิก'}</button></div></article>`).join(''):'<p class="note">ไม่มีออเดอร์ที่กำลังทำ</p>';
}
const ST_LBL=['รอรับ','รับแล้ว','กำลังปรุง','รอเสิร์ฟ'];
const unservedOf=s=>Object.entries(s.orders||{}).map(([id,o])=>({...o,id})).filter(o=>!o.cancelled&&o.status<4&&(o.lines||[]).some(l=>!l.x)).sort((a,b)=>a.created-b.created);
function warnBar(s){const u=unservedOf(s);if(!u.length)return '';
 const c=[0,1,2,3].map(i=>[i,u.filter(o=>o.status===i).length]).filter(x=>x[1]).map(x=>ST_LBL[x[0]]+' '+x[1]).join(' · ');
 return `<div class="warnbar"><b>มีออเดอร์ที่ยังไม่ได้เสิร์ฟ ${u.length} ใบ</b><br>${c}</div>`}
const panelKey=()=>[panelSid,panelMode,JSON.stringify(staffDraft),closeArm].join('|');
function renderAdmin(){
 const r=$('#adminOver');if(r.hidden||!isAdmin())return;
 const fresh=adminOrders().filter(o=>!known.has(o.sid+o.id));if(fresh.length){if(fresh.some(o=>o.status===0&&o.by!=='staff'))playSnd('order');fresh.forEach(o=>known.add(o.sid+o.id))}
 const fc=callKeys().filter(k=>!knownC.has(k));if(fc.length){playSnd('call');lastAlarm=Date.now();fc.forEach(k=>knownC.add(k))}
 const sig=adminTab+JSON.stringify(OPENS)+(adminTab==='history'?JSON.stringify(CLOSEDS)+LEGACY.length:'')+(adminTab==='menu'?JSON.stringify(MSTAT)+svcKey():'')+cancelArm+SND.ready+panelKey()+Math.floor(Date.now()/60000)+(panelSid&&!OPENS.some(x=>x.sid===panelSid)?'w'+Math.floor(Date.now()/1000):'');
 if(sig===aSig)return;aSig=sig;
 const sc=r.scrollTop;
 const newO=adminOrders().filter(o=>o.status===0&&!o.cancelled).length;
 const body=adminTab==='floor'?floorHtml():adminTab==='orders'?ordersHtml():adminTab==='menu'?menuTabHtml():histHtml();
 r.innerHTML=`<div class="wrap"><header><h2>จัดการร้าน</h2><div class="row"><button class="btn ghost" id="snd">${SND.ready?'เสียงพร้อม · ทดสอบ':'แตะเพื่อเปิดเสียง'}</button><button class="btn ghost" id="al">ออกจากระบบ</button><button class="btn ghost" id="ax">กลับหน้าร้าน</button></div></header>
 <div class="tabs"><button data-tab="floor" aria-pressed="${adminTab==='floor'}">โต๊ะ (${OPENS.length})</button><button data-tab="orders" aria-pressed="${adminTab==='orders'}">ออเดอร์${newO?' ('+newO+')':''}</button><button data-tab="menu" aria-pressed="${adminTab==='menu'}">เมนู</button><button data-tab="history" aria-pressed="${adminTab==='history'}">ประวัติ</button></div>${body}</div>`;
 r.scrollTop=sc;
 $('#snd').onclick=()=>{if(SND.ready)playSnd('call');else sndUnlock()};
 $('#ax').onclick=closeAdmin;
 $('#al').onclick=()=>{auth.signOut().then(()=>openAdmin())};
 r.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;aSig='';renderAdmin()});
 bindActs(r);
 renderPanel();
}
function openPanel(sid){panelSid=sid;panelAt=Date.now();panelSeen=false;panelMode='main';staffDraft={};closeArm=null;aSig='';renderAdmin()}
function closePanel(){panelSid=null;closeArm=null;panelMode='main';staffDraft={};$('#tblPanel').hidden=true;aSig=''}
function renderPanel(){
 const P=$('#tblPanel'),sh=$('#tblSheet');
 if(!panelSid){P.hidden=true;return}
 const s=OPENS.find(x=>x.sid===panelSid);
 if(s)panelSeen=true;
 if(!s){if(!panelSeen&&Date.now()-panelAt<6000){P.hidden=false;sh.innerHTML='<p class="sub">กำลังโหลด…</p>';return}closePanel();return}
 P.hidden=false;
 const head=`<h3>โต๊ะ ${s.table} <small style="font-size:14px;color:var(--mute)">เปิด ${fmtT(s.openedAt)} · ${durTxt(Date.now()-s.openedAt)}</small></h3>`;
 if(panelMode==='move'){
  const free=Array.from({length:NTABLES},(_,i)=>i+1).filter(n=>!tableSess(n));
  sh.innerHTML=head+`<p class="sub">เลือกโต๊ะปลายทาง (ออเดอร์และ QR เดิมจะตามไปด้วย)</p><div class="floor">${free.map(n=>`<button class="tb off" data-a="pmoveto" data-n="${n}"><b>${n}</b><span>ว่าง</span></button>`).join('')||'<p class="note">ไม่มีโต๊ะว่าง</p>'}</div><div class="a-act" style="margin-top:16px"><button class="btn ghost" data-a="pback">กลับ</button></div>`;
  bindActs(sh);return;
 }
 if(panelMode==='closeask'){
  const u=unservedOf(s),cook=u.filter(o=>o.status===2).length;
  sh.innerHTML=head+(u.length?`<div class="warnbar"><b>มีออเดอร์ที่ยังไม่ได้เสิร์ฟ ${u.length} ใบ${cook?` (กำลังปรุงอยู่ ${cook} ใบ)`:''}</b><br>ถ้าปิดโต๊ะตอนนี้ ออเดอร์เหล่านี้จะหายจากหน้าครัว และลูกค้าสั่งเพิ่มไม่ได้</div>
  <ul class="a-it">${u.map(o=>`<li><b>${o.no}</b> · ${ST_LBL[o.status]}<br>${o.lines.filter(l=>!l.x).map(l=>`${l.qty} × ${itemName(l.id,'th')}`).join(', ')}</li>`).join('')}</ul>`:'<p class="sub">ออเดอร์เสิร์ฟครบแล้ว</p>')+
  `<div class="a-act" style="margin-top:16px"><button class="btn" data-a="pcloseforce" data-sid="${s.sid}">${u.length?'ปิดโต๊ะทั้งที่ยังไม่เสิร์ฟ':'ปิดโต๊ะ'}</button><button class="btn ghost" data-a="pback">กลับ</button></div>`;
  bindActs(sh);return;
 }
 if(panelMode==='order'){
  const cnt=Object.values(staffDraft).reduce((a,b)=>a+b,0);
  sh.innerHTML=head+`<p class="sub">สั่งแทนลูกค้า (ออเดอร์จะอยู่สถานะ "รับออเดอร์แล้ว")</p><ul class="lines">${MENU.map(m=>{const q=staffDraft[m.id]||0,o=isOut(m.id);return `<li><span class="n">${m.nm.th}${o?' <span style="color:var(--red-hi)">(หมด)</span>':''}</span><span class="p">${money(m.price)}</span><span class="m"></span><span style="grid-column:2;text-align:right"><button class="sm" data-a="pq" data-id="${m.id}" data-d="-1" ${q?'':'disabled'}>−</button> <b>${q}</b> <button class="sm" data-a="pq" data-id="${m.id}" data-d="1" ${o?'disabled':''}>+</button></span></li>`}).join('')}</ul>
  <div class="a-act" style="margin-top:16px"><button class="btn" data-a="psend" ${cnt?'':'disabled'}>บันทึกออเดอร์ (${cnt})</button><button class="btn ghost" data-a="pback">กลับ</button></div>`;
  bindActs(sh);return;
 }
 const os=Object.entries(s.orders||{}).map(([id,o])=>({...o,id})).sort((a,b)=>a.created-b.created);
 const unserved=unservedOf(s).length;
 const calls=(s.callStaff>0?`<div class="a-act" style="margin-bottom:8px"><button class="btn" data-a="ackS" data-sid="${s.sid}">รับทราบ: เรียกพนักงาน</button></div>`:'')+(s.callBill>0?`<div class="a-act" style="margin-bottom:8px"><button class="btn" data-a="ackB" data-sid="${s.sid}">รับทราบ: ขอเช็กบิล</button></div>`:'');
 sh.innerHTML=head+calls+warnBar(s)+`<div class="qrbox" id="qrBox"></div><p class="note" style="overflow-wrap:anywhere;margin:0">${esc(tableUrl(s.sid))}</p>
 <div class="a-act" style="margin-top:10px"><button class="btn ghost" data-a="pcopy">คัดลอกลิงก์</button><button class="btn ghost" data-a="ptry">ทดลองสั่งเป็นลูกค้า</button></div>
 <h3 class="mh" style="margin-top:22px">ออเดอร์ของโต๊ะนี้</h3>
 ${os.length?os.map(o=>`<div class="a-ord" style="padding:12px"><div class="a-hd"><span><b>${o.no}</b>${o.by==='staff'?' (พนักงาน)':''}</span><span class="a-st">${o.cancelled?'ยกเลิก':STTH[STEPS[o.status]]} · ${fmtT(o.created)}</span></div>
  <ul class="a-it">${o.lines.map((l,i)=>`<li>${l.x?`<s style="opacity:.55"><b>${l.qty} ×</b> ${itemName(l.id,'th')}</s> ยกเลิก`:`<b>${l.qty} ×</b> ${itemName(l.id,'th')}<span style="float:right">${money(lineAmt(l))}${o.cancelled?'':` <button class="sm" data-a="ldec" data-sid="${s.sid}" data-id="${o.id}" data-i="${i}" ${l.qty>1?'':'disabled'}>−1</button><button class="sm" data-a="lvoid" data-sid="${s.sid}" data-id="${o.id}" data-i="${i}">ยกเลิก</button>`}</span>`}${l.note?`<small>${esc(l.note)}</small>`:''}</li>`).join('')}</ul></div>`).join(''):'<p class="note">ยังไม่มีออเดอร์</p>'}
 <div class="sum"><span>ยอดรวม</span><span>${money(sessTotal(s))} บาท</span></div>
 <div class="a-act" style="margin-top:16px"><button class="btn ghost" data-a="porder">สั่งแทนลูกค้า</button><button class="btn ghost" data-a="pmove">ย้ายโต๊ะ</button></div>
 <div class="a-act" style="margin-top:10px"><button class="btn" data-a="pclosetable" data-sid="${s.sid}">${closeArm===s.sid?'กดอีกครั้งเพื่อยืนยันปิดโต๊ะ':'ปิดโต๊ะ'}</button><button class="btn ghost" data-a="pclose">ปิดหน้าต่าง</button></div>`;
 try{new QRCode($('#qrBox'),{text:tableUrl(s.sid),width:240,height:240,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
 catch(e){$('#qrBox').textContent='สร้าง QR ไม่ได้ ใช้ลิงก์ด้านล่างแทน'}
 bindActs(sh);
}
function bindActs(root){root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(b))}
function doAct(b){
 const a=b.dataset.a,sid=b.dataset.sid,id=b.dataset.id;
 if(a==='topen')return openTable(+b.dataset.n);
 if(a==='tdetail')return openPanel(sid);
 if(a==='mtoggle')return toggleMenu(id);
 if(a==='next'){const o=adminOrders().find(x=>x.sid===sid&&x.id===id);if(o)upd(sid,{['orders.'+id+'.status']:Math.min(4,o.status+1)});return}
 if(a==='prev'){const o=adminOrders().find(x=>x.sid===sid&&x.id===id);if(o)upd(sid,{['orders.'+id+'.status']:Math.max(0,o.status-1)});return}
 if(a==='cancel'){const k=sid+id;if(cancelArm===k){cancelArm=null;upd(sid,{['orders.'+id+'.cancelled']:true})}else{cancelArm=k;aSig='';renderAdmin()}return}
 if(a==='ackS')return upd(sid,{callStaff:0});
 if(a==='ackB')return upd(sid,{callBill:0});
 if(a==='ldec')return lineEdit(sid,id,+b.dataset.i,'dec');
 if(a==='lvoid')return lineEdit(sid,id,+b.dataset.i,'void');
 if(a==='pclose')return closePanel();
 if(a==='pback'){panelMode='main';aSig='';return renderAdmin()}
 if(a==='pmove'){panelMode='move';aSig='';return renderAdmin()}
 if(a==='pmoveto')return moveTable(panelSid,+b.dataset.n);
 if(a==='porder'){panelMode='order';staffDraft={};aSig='';return renderAdmin()}
 if(a==='pq'){const q=Math.max(0,Math.min(20,(staffDraft[id]||0)+(+b.dataset.d)));if(q)staffDraft[id]=q;else delete staffDraft[id];aSig='';return renderAdmin()}
 if(a==='psend')return staffOrderSend(panelSid);
 if(a==='pcopy'){const u=tableUrl(panelSid);if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('คัดลอกลิงก์แล้ว'),()=>toast(u));else toast(u);return}
 if(a==='ptry'){const sid2=panelSid;closePanel();closeAdmin();SESS=null;setSid(sid2);watchSession();openOrderView();return}
 if(a==='pclosetable'){const ss=OPENS.find(x=>x.sid===sid);
  if(ss&&unservedOf(ss).length){panelMode='closeask';aSig='';renderAdmin();return}
  if(closeArm===sid){closeArm=null;closeTable(sid)}else{closeArm=sid;aSig='';renderAdmin()}return}
 if(a==='pcloseforce'){closeTable(sid);return}
}

/* ---------- routing, secret entrance, polling ---------- */
function route(){
 const h=location.hash.slice(1);
 const m=/^s=([a-z0-9]{12,40})$/i.exec(h);
 if(m){
  const sid=m[1];
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(sid!==SID){SESS=null;wasOpen=false;setSid(sid);cart=[];closeSummary();closeStatus();watchSession()}
  openOrderView();
  return;
 }
 if(h==='admin')openAdmin();else if($('#adminOver').hidden===false&&h!=='admin')closeAdmin();
}
addEventListener('hashchange',route);
let pressT;const lg=$('#secretLogo');
['pointerdown'].forEach(e=>lg.addEventListener(e,()=>{pressT=setTimeout(()=>{location.hash='admin'},900)}));
['pointerup','pointerleave','pointercancel'].forEach(e=>lg.addEventListener(e,()=>clearTimeout(pressT)));
setInterval(()=>{refreshOrderView();alarmTick();renderAdmin();if(!$('#statusOver').hidden)renderStatus(false);updateBar();updateOpen()},1000);
$('#seeMenu').onclick=()=>$('#menu').scrollIntoView({behavior:'smooth'});
applyLang();route();
</script>

</body></html>
